# Optional buffer adapters. Select a pipeline explicitly for the intended input.
# No file is searched for automatically and no native code is executed.

[transforms]
zip_payload = buffer extract_concatenated_zip() {
    // Ordinary single-disk ZIP, with offsets relative to its own first byte.
    // The ZIP must end at the end of the supplied buffer, including its comment.
    if (input_size < 22) reject();
    uint64_t first = 0;
    if (input_size > 65557) first = input_size - 65557;
    uint64_t end = input_size - 22;
    while (1) {
        if (read32(input, end) == 0x06054b50) {
            uint64_t comment_size = read8(input, end + 20) | (read8(input, end + 21) << 8);
            if (end + 22 + comment_size == input_size) {
                if (read32(input, end + 4) != 0) reject();
                uint64_t counts = read32(input, end + 8);
                uint64_t count = counts & 65535;
                if (count == 0 || count == 65535 || count != (counts >> 16)) reject();
                uint64_t directory_size = read32(input, end + 12);
                uint64_t directory_offset = read32(input, end + 16);
                if (directory_size < 46 || directory_size > end || directory_offset == 0xffffffff) reject();
                uint64_t directory = end - directory_size;
                if (directory_offset > directory || read32(input, directory) != 0x02014b50) reject();
                uint64_t start = directory - directory_offset;
                if (read32(input, start) != 0x04034b50) reject();
                return slice(start, input_size - start);
            }
        }
        if (end == first) break;
        end--;
    }
    reject();
}

header_payload = buffer remove_sized_header() {
    // A caller-authored wrapper stores its complete header size in its first word.
    if (input_size < 4) reject();
    uint64_t header_size = read32(input, 0);
    if (header_size < 4 || header_size > input_size) reject();
    return slice(header_size, input_size - header_size);
}

indexed_candidates = buffer read_range_directory() {
    // Authored envelope: "IDX1", u32 count, then (u64 offset, u64 length) pairs.
    if (input_size < 8 || read32(input, 0) != 0x31584449) reject();
    uint64_t count = read32(input, 4);
    if (count > 64 || count * 16 > input_size - 8) reject();
    for (uint64_t i = 0; i < count; i++) {
        write64(scratch, i * 80, read64(input, 8 + i * 16));
        write64(scratch, i * 80 + 8, read64(input, 16 + i * 16));
    }
    // Empty operation names select the caller's input pipeline.
    return scratch_slice(0, count * 80);
}

copy_payload = buffer copy_payload() {
    return slice(0, input_size);
}

text_newlines = buffer normalize_text_lines() {
    // Optional record adapter: leave every non-text context unchanged.
    if (metadata_size != 16 || read32(metadata, 0) != 0x43534c43 ||
        read32(metadata, 4) != 2 || read32(metadata, 12) != 0) return slice(0, input_size);
    uint64_t output_size = 0;
    for (uint64_t i = 0; i < input_size; i++) {
        uint64_t value = read8(input, i);
        if (value == 13 && i + 1 < input_size && read8(input, i + 1) == 10) continue;
        write8(work, output_size, value);
        output_size++;
    }
    return slice(0, output_size);
}

[pipelines]
embedded_zip = zip_payload
sized_zlib = header_payload | builtin.zlib:16777216
little_endian_words = builtin.byteswap32
