name: build

# The compile-and-test signal every change gets, on a CI host that needs nothing configured. The
# level-0 workflow beside this one needs a fixture source and is skipped without it, so without
# this job a contributor's pull request would arrive with no check at all.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: linux-x64 build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the shared video provider
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          python3 tools/media/prepare_ci.py --download --work-root "$RUNNER_TEMP/video-native" --env-file "$GITHUB_ENV" --format github
      - name: Build the core
        run: |
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          make -j4 core
      - name: Run the full check suite
        run: |
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          make -j4 check

  linux-sanitizers:
    name: linux-x64 address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the instrumented C and C++ suite
        run: |
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          make -j1 VIDEO_PROVIDER=none sanitizer-check

  mingw:
    name: windows cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the MinGW toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64 nasm pkg-config
      - name: Prepare the win-x64 video provider
        run: |
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          python3 tools/media/prepare_ci.py --download --target windows-x64 --work-root "$RUNNER_TEMP/video-x64" --env-file "$GITHUB_ENV" --format github
      - name: Build win-x64
        run: make -j4 platform=win CROSS_COMPILE=x86_64-w64-mingw32- core
      - name: Prepare the win-i686 video provider
        run: |
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          python3 tools/media/prepare_ci.py --download --target windows-i686 --work-root "$RUNNER_TEMP/video-i686" --env-file "$GITHUB_ENV" --format github
      - name: Build win-i686
        run: make -j4 platform=win CROSS_COMPILE=i686-w64-mingw32- BUILD_DIR=build/win32 core

  linux-armhf:
    name: linux ARMv7 hard-float build
    runs-on: ubuntu-latest
    env:
      CFLAGS: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
      CXXFLAGS: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the ARM hard-float toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config
      - name: Prepare the ARM hard-float video provider
        run: |
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          python3 tools/media/prepare_ci.py --download --target linux-armhf --work-root "$RUNNER_TEMP/video-armhf" --env-file "$GITHUB_ENV" --format github
      - name: Build and check the export surface
        run: |
          make -j4 platform=unix CROSS_COMPILE=arm-linux-gnueabihf- BUILD_DIR=build/linux-armhf core
          make platform=unix CROSS_COMPILE=arm-linux-gnueabihf- BUILD_DIR=build/linux-armhf export-check

  android:
    name: android ${{ matrix.abi }} build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate the Android NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            printf '%s\n' "No Android NDK is installed on this runner." >&2
            exit 1
          fi
          printf 'NDK_ROOT=%s\n' "$ndk" >> "$GITHUB_ENV"
      - name: Prepare the Android video provider
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config
          free -h; nproc; cat /proc/loadavg; df -h /tmp
          python3 tools/media/prepare_ci.py --download --target android --work-root "$RUNNER_TEMP/video-android" --env-file "$GITHUB_ENV" --format github
      - name: Build through the NDK entry point
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          "$NDK_ROOT/ndk-build" -j4 -C jni APP_ABI="$ANDROID_ABI"
          test -f "libs/$ANDROID_ABI/libretro.so"

  # The two Apple jobs build the core with the Apple toolchain, which is the compiler family the
  # libretro osx templates use, and check the export surface against the same reviewed list the ELF
  # check reads. Runner labels follow actions/runner-images: macos-15-intel is the Intel image and
  # macos-15 the Apple Silicon one.
  macos-x64:
    name: macos x86_64 build and export check
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the shared video provider
        run: |
          brew install nasm pkgconf
          vm_stat; sysctl -n hw.ncpu; uptime; df -h "$RUNNER_TEMP"
          python3 tools/media/prepare_ci.py --download --work-root "$RUNNER_TEMP/video-native" --env-file "$GITHUB_ENV" --format github
      - name: Build the core with warnings as errors
        run: make -j4 platform=osx CC=clang CXX=clang++ warnings-check
      - name: Check the image architecture and the export surface
        run: |
          set -euo pipefail
          lipo -info anygm_libretro.dylib | grep -q x86_64
          otool -l anygm_libretro.dylib | grep -A4 -e LC_VERSION_MIN_MACOSX -e LC_BUILD_VERSION || true
          make export-check
      - name: Load the core through its public entry points
        run: |
          python3 - <<'PY'
          import ctypes

          core = ctypes.CDLL("./anygm_libretro.dylib")
          core.retro_api_version.restype = ctypes.c_uint
          assert core.retro_api_version() == 1, core.retro_api_version()
          print("retro_api_version:", core.retro_api_version())
          PY

  macos-arm64:
    name: macos arm64 build and export check
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the shared video provider
        run: |
          brew install nasm pkgconf
          vm_stat; sysctl -n hw.ncpu; uptime; df -h "$RUNNER_TEMP"
          python3 tools/media/prepare_ci.py --download --work-root "$RUNNER_TEMP/video-native" --env-file "$GITHUB_ENV" --format github
      - name: Build the core with warnings as errors
        run: make -j4 platform=osx CC=clang CXX=clang++ warnings-check
      - name: Check the image architecture and the export surface
        run: |
          set -euo pipefail
          lipo -info anygm_libretro.dylib | grep -q arm64
          make export-check
      - name: Build again through the Apple cross variables the libretro template exports
        run: |
          set -euo pipefail
          make -j4 platform=osx CROSS_COMPILE=1 \
            LIBRETRO_APPLE_PLATFORM=arm64-apple-macos11.0 \
            LIBRETRO_APPLE_ISYSROOT="$(xcodebuild -version -sdk macosx Path)" \
            BUILD_DIR=build/osx-arm64-cross core
          lipo -info anygm_libretro.dylib | grep -q arm64
          make export-check BUILD_DIR=build/osx-arm64-cross
      - name: Load the core through its public entry points
        run: |
          python3 - <<'PY'
          import ctypes

          core = ctypes.CDLL("./anygm_libretro.dylib")
          core.retro_api_version.restype = ctypes.c_uint
          assert core.retro_api_version() == 1, core.retro_api_version()
          print("retro_api_version:", core.retro_api_version())
          PY
