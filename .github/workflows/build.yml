name: build

# The compile-and-test signal every change gets, on a CI host that needs nothing configured. The
# level-0 workflow beside this one needs a fixture source and is skipped without it, so without
# this job a contributor's pull request would arrive with no check at all.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: linux-x64 build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the core
        run: make -j"$(nproc)" core
      - name: Run the full check suite
        run: make -j"$(nproc)" check

  mingw:
    name: windows cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the MinGW toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 g++-mingw-w64
      - name: Build win-x64
        run: make -j"$(nproc)" platform=win CROSS_COMPILE=x86_64-w64-mingw32- core
      - name: Build win-i686
        run: make -j"$(nproc)" platform=win CROSS_COMPILE=i686-w64-mingw32- BUILD_DIR=build/win32 core

  android:
    name: android arm64 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate the Android NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ndk" ] || [ ! -d "$ndk" ]; then
            printf '%s\n' "No Android NDK is installed on this runner." >&2
            exit 1
          fi
          printf 'NDK_BIN=%s/toolchains/llvm/prebuilt/linux-x86_64/bin\n' "$ndk" >> "$GITHUB_ENV"
      - name: Build android-arm64
        run: |
          make -j"$(nproc)" platform=android BUILD_DIR=build/android-arm64 \
            CC="$NDK_BIN/aarch64-linux-android24-clang" \
            CXX="$NDK_BIN/aarch64-linux-android24-clang++" AR="$NDK_BIN/llvm-ar" core
          test -f anygm_libretro_android.so

  # The two Apple jobs build the core with the Apple toolchain, which is the compiler family the
  # libretro osx templates use, and check the export surface against the same reviewed list the ELF
  # check reads. Runner labels follow actions/runner-images: macos-15-intel is the Intel image and
  # macos-15 the Apple Silicon one.
  macos-x64:
    name: macos x86_64 build and export check
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the core with warnings as errors
        run: make -j"$(sysctl -n hw.ncpu)" platform=osx CC=clang CXX=clang++ warnings-check
      - name: Check the image architecture and the export surface
        run: |
          set -euo pipefail
          lipo -info anygm_libretro.dylib | grep -q x86_64
          otool -l anygm_libretro.dylib | grep -A4 -e LC_VERSION_MIN_MACOSX -e LC_BUILD_VERSION || true
          make export-check
      - name: Load the core through its public entry points
        run: |
          python3 - <<'PY'
          import ctypes

          core = ctypes.CDLL("./anygm_libretro.dylib")
          core.retro_api_version.restype = ctypes.c_uint
          assert core.retro_api_version() == 1, core.retro_api_version()
          print("retro_api_version:", core.retro_api_version())
          PY

  macos-arm64:
    name: macos arm64 build and export check
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the core with warnings as errors
        run: make -j"$(sysctl -n hw.ncpu)" platform=osx CC=clang CXX=clang++ warnings-check
      - name: Check the image architecture and the export surface
        run: |
          set -euo pipefail
          lipo -info anygm_libretro.dylib | grep -q arm64
          make export-check
      - name: Build again through the Apple cross variables the libretro template exports
        run: |
          set -euo pipefail
          make -j"$(sysctl -n hw.ncpu)" platform=osx CROSS_COMPILE=1 \
            LIBRETRO_APPLE_PLATFORM=arm64-apple-macos11.0 \
            LIBRETRO_APPLE_ISYSROOT="$(xcodebuild -version -sdk macosx Path)" \
            BUILD_DIR=build/osx-arm64-cross core
          lipo -info anygm_libretro.dylib | grep -q arm64
          make export-check BUILD_DIR=build/osx-arm64-cross
      - name: Load the core through its public entry points
        run: |
          python3 - <<'PY'
          import ctypes

          core = ctypes.CDLL("./anygm_libretro.dylib")
          core.retro_api_version.restype = ctypes.c_uint
          assert core.retro_api_version() == 1, core.retro_api_version()
          print("retro_api_version:", core.retro_api_version())
          PY
