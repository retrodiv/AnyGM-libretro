# GitLab CI/CD for the libretro build infrastructure.

.core-defs:
  variables:
    JNI_PATH: .
    CORENAME: anygm

include:
  - project: libretro-infrastructure/ci-templates
    file: /windows-x64-mingw.yml
  - project: libretro-infrastructure/ci-templates
    file: /windows-i686-mingw.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-x64.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-i686.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-aarch64.yml
  - project: libretro-infrastructure/ci-templates
    file: /android-jni.yml
  - project: libretro-infrastructure/ci-templates
    file: /osx-x64.yml
  - project: libretro-infrastructure/ci-templates
    file: /osx-arm64.yml

stages:
  - build-prepare
  - build-shared
  - build-static

libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs

libretro-build-windows-i686:
  extends:
    - .libretro-windows-i686-mingw-make-default
    - .core-defs

libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs

libretro-build-linux-i686:
  extends:
    - .libretro-linux-i686-make-default
    - .core-defs

libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs

# The Android template runs ndk-build, which builds the core through this repository's own Makefile
# for platform=android and installs the result as libs/arm64-v8a/libretro.so.
libretro-build-android-arm64:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-defs

# The 10-7 template is the legacy variant; the mainstream choice is the default (macOS 10.9).
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs

libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs
