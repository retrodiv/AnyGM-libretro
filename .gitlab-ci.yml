# GitLab CI/CD for the libretro build infrastructure.

.core-defs:
  variables:
    JNI_PATH: .
    CORENAME: anygm

include:
  - project: libretro-infrastructure/ci-templates
    file: /windows-x64-mingw.yml
  - project: libretro-infrastructure/ci-templates
    file: /windows-i686-mingw.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-x64.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-i686.yml
  - project: libretro-infrastructure/ci-templates
    file: /linux-aarch64.yml
  - project: libretro-infrastructure/ci-templates
    file: /android-jni.yml
  - project: libretro-infrastructure/ci-templates
    file: /osx-x64.yml
  - project: libretro-infrastructure/ci-templates
    file: /osx-arm64.yml

stages:
  - build-prepare
  - build-shared
  - build-static

.video-prepare:
  before_script:
    - export NUMPROC=4
    - |
      if [ "$(uname -s)" = Darwin ]; then
        vm_stat; sysctl -n hw.ncpu; uptime; df -h "${TMPDIR:-/tmp}"
        export SDKROOT="$(xcodebuild -version -sdk macosx Path)"
        export LIBRETRO_APPLE_ISYSROOT="$SDKROOT"
      else
        free -h; nproc; cat /proc/loadavg; df -h /tmp
      fi
    - export ANYGM_VIDEO_WORK="$(mktemp -d)"
    - python3 tools/media/prepare_ci.py --download --target "$ANYGM_VIDEO_TARGET" --work-root "$ANYGM_VIDEO_WORK/provider" --env-file "$ANYGM_VIDEO_WORK/environment.sh"
    - . "$ANYGM_VIDEO_WORK/environment.sh"

libretro-build-windows-x64:
  extends:
    - .libretro-windows-x64-mingw-make-default
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: windows-x64
  before_script:
    - !reference [.libretro-windows-x64-mingw, before_script]
    - !reference [.video-prepare, before_script]

libretro-build-windows-i686:
  extends:
    - .libretro-windows-i686-mingw-make-default
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: windows-i686
  before_script:
    - !reference [.libretro-windows-i686-mingw, before_script]
    - !reference [.video-prepare, before_script]

libretro-build-linux-x64:
  extends:
    - .libretro-linux-x64-make-default
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: native
  image: ubuntu:24.04
  before_script:
    - !reference [.libretro-linux-x64, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends make gcc g++ python3 pkg-config nasm ca-certificates xz-utils
    - !reference [.video-prepare, before_script]

libretro-build-linux-i686:
  extends:
    - .libretro-linux-i686-make-default
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: linux-i686
    CFLAGS: -m32
    CXXFLAGS: -m32
    LDFLAGS: -m32
  image: ubuntu:24.04
  before_script:
    - !reference [.libretro-linux-i686, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends make gcc g++ python3 pkg-config nasm ca-certificates xz-utils gcc-multilib g++-multilib
    - !reference [.video-prepare, before_script]

libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-aarch64-make-default
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: native
  image: ubuntu:24.04
  before_script:
    - !reference [.libretro-linux-aarch64, before_script]
    - apt-get update
    - apt-get install -y --no-install-recommends make gcc g++ python3 pkg-config nasm ca-certificates xz-utils
    - !reference [.video-prepare, before_script]

# There is no upstream armhf template. Cross-build on an x86-64 image with the
# hard-float toolchain and strip with the matching target tool.
libretro-build-linux-armhf:
  extends:
    - .libretro-linux-x64
    - .core-defs
  image: ubuntu:24.04
  variables:
    ANYGM_VIDEO_TARGET: linux-armhf
    CFLAGS: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
    CXXFLAGS: -march=armv7-a -mfpu=vfpv3-d16 -mfloat-abi=hard
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends make python3 pkg-config ca-certificates xz-utils gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
    - !reference [.video-prepare, before_script]
  script:
    - make -j4 platform=unix CROSS_COMPILE=arm-linux-gnueabihf- BUILD_DIR=build/linux-armhf core
  after_script:
    - if [ "$STRIP_CORE_LIB" -eq 1 ] && [ -f anygm_libretro.so ]; then arm-linux-gnueabihf-strip --strip-unneeded anygm_libretro.so; fi

# The Android template runs ndk-build through the repository's Makefile and
# installs each ABI as libs/<abi>/libretro.so.
libretro-build-android-arm64:
  extends:
    - .libretro-android-jni-arm64-v8a
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: android
  before_script:
    - !reference [.libretro-android-jni, before_script]
    - !reference [.video-prepare, before_script]

libretro-build-android-armv7:
  extends:
    - .libretro-android-jni-armeabi-v7a
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: android
  before_script:
    - !reference [.libretro-android-jni, before_script]
    - !reference [.video-prepare, before_script]

# The 10-7 template is the legacy variant; the mainstream choice is the default (macOS 10.9).
libretro-build-osx-x64:
  extends:
    - .libretro-osx-x64-make-default
    - .core-defs
  variables:
    ANYGM_VIDEO_TARGET: native
  before_script:
    - !reference [.libretro-osx-x64, before_script]
    - !reference [.video-prepare, before_script]

libretro-build-osx-arm64:
  extends:
    - .libretro-osx-arm64-make-default
    - .core-defs

  variables:
    ANYGM_VIDEO_TARGET: native
    MACOSX_DEPLOYMENT_TARGET: "11.0"
  before_script:
    - !reference [.libretro-osx-arm64, before_script]
    - !reference [.video-prepare, before_script]
